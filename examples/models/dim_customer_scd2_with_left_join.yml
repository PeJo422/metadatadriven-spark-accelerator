name: dim_customer_history
source: bronze.customer
target: silver.dim_customer_history

scd_type: 2

business_key:
  columns:
    - CompanyId
    - CustomerNumber

row_hash_columns:
  - FirstName
  - LastName
  - Email
  - OrderDate
  - RegionName

row_filters:
  - column: IsDeleted
    operator: is_null

joins:
  - table: bronze.region
    type: left
    on:
      - left_alias: s
        left_column: RegionId
        right_column: RegionId

columns:
  - name: CompanyId
    type: int
  - name: CustomerNumber
    type: string
  - name: FirstName
    type: string
  - name: LastName
    type: string
  - name: Email
    type: string
  - name: RegionName
    type: string
  - name: OrderDate
    type: date
